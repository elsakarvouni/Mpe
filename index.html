<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Για σένα 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500;1,600&family=Quicksand:wght@500;600;700&display=swap');

  :root{
    --blush-1: #FFE3EC;
    --blush-2: #FDEFE2;
    --rose: #C6577A;
    --rose-deep: #9C3F5E;
    --lavender: #B98BC9;
    --plum: #4A2E3B;
    --cream: #FFF8F3;
    --leaf: #8FAE7C;
    --skin: #F0C4A2;
    --dark-1: #1A1023;
    --dark-2: #2B1830;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(160deg, var(--blush-1) 0%, var(--blush-2) 55%, #FDE6E0 100%);
    color: var(--plum);
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------------- INTRO SCREEN ---------------- */
  #intro {
    z-index: 10;
    background: radial-gradient(ellipse at 50% 30%, var(--dark-2) 0%, var(--dark-1) 70%);
  }
  #intro.hide {
    animation: introOut 0.7s ease forwards;
    pointer-events: none;
  }
  @keyframes introOut {
    to { opacity: 0; transform: scale(0.96); }
  }

  .bouquet-wrap {
    position: relative;
    width: 260px;
    height: 340px;
  }

  /* panda holding the stems */
  .hand {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 92px;
    line-height: 1;
    z-index: 6;
  }

  .stems {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 140px;
  }

  .flower-slot {
    position: absolute;
    bottom: 130px;
    width: 70px;
    height: 70px;
    opacity: 0;
    transform: scale(0.2) rotate(-15deg);
  }
  .flower-slot.bloom {
    animation: flowerBloom 0.7s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes flowerBloom {
    0% { opacity: 0; transform: scale(0.15) rotate(-20deg); }
    70% { opacity: 1; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .fs-1 { left: 50%; margin-left: -35px; bottom: 172px; }
  .fs-2 { left: 50%; margin-left: -88px; bottom: 140px; }
  .fs-3 { left: 50%; margin-left: 22px; bottom: 138px; }
  .fs-4 { left: 50%; margin-left: -55px; bottom: 100px; width: 56px; height: 56px; }
  .fs-5 { left: 50%; margin-left: 4px; bottom: 96px; width: 56px; height: 56px; }
  .fs-6 { left: 50%; margin-left: -110px; bottom: 172px; width: 50px; height: 50px; }
  .fs-7 { left: 50%; margin-left: 55px; bottom: 168px; width: 50px; height: 50px; }

  /* extra floating background flowers on the dark intro */
  .bg-flower {
    position: absolute;
    width: 46px;
    height: 46px;
    opacity: 0;
  }
  .bg-flower.bloom {
    animation: flowerBloom 0.8s cubic-bezier(.34,1.56,.64,1) forwards, drift 6s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(6deg); }
  }
  .bgf-1 { top: 8%; left: 10%; }
  .bgf-2 { top: 14%; right: 8%; width: 36px; height: 36px; }
  .bgf-3 { bottom: 10%; left: 6%; width: 40px; height: 40px; }
  .bgf-4 { bottom: 6%; right: 12%; }
  .bgf-5 { top: 45%; left: 4%; width: 30px; height: 30px; }
  .bgf-6 { top: 40%; right: 4%; width: 34px; height: 34px; }

  .petal { fill: var(--rose); }
  .petal.alt { fill: var(--lavender); }
  .petal.peach { fill: #F4A997; }
  .petal.light { fill: #FDEAF0; }
  .center-dot { fill: #F4C77A; }
  .leaf-shape { fill: var(--leaf); }

  /* panda burst (sends the hearts) */
  .kiss-burst {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 44px;
    opacity: 0;
  }
  .kiss-burst.go {
    animation: kissFly 1.6s ease-out forwards;
  }
  @keyframes kissFly {
    0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.6) rotate(0deg); }
    15% { opacity: 1; transform: translateX(-50%) translateY(-8px) scale(1.1) rotate(-6deg); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-40px) scale(1.15) rotate(4deg); }
    100% { opacity: 1; transform: translateX(-50%) translateY(-40px) scale(1.15) rotate(0deg); }
  }

  .mini-hearts-burst {
    position: absolute;
    top: 10%;
    left: 50%;
    width: 0;
    height: 0;
  }
  .mini-hearts-burst span {
    position: absolute;
    font-size: 16px;
    opacity: 0;
  }
  .mini-hearts-burst span.go {
    animation: miniHeart 1.4s ease-out forwards;
  }
  @keyframes miniHeart {
    0% { opacity: 0; transform: translate(0,0) scale(0.4); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1); }
  }

  .intro-caption {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 85%;
    opacity: 0;
  }
  .intro-caption.show {
    animation: capIn 0.8s ease forwards;
  }
  @keyframes capIn {
    to { opacity: 1; }
  }
  .next-btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 15px;
    background: var(--rose);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 13px 28px;
    box-shadow: 0 10px 22px rgba(198, 87, 122, 0.4);
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .next-btn.show {
    opacity: 1;
    pointer-events: auto;
    animation: btnPulse 1.8s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .next-btn:active { transform: scale(0.94); }

  /* ---------------- MAIN SCREEN (question) ---------------- */
  #main { opacity: 0; pointer-events: none; z-index: 5; }
  #main.show { opacity: 1; pointer-events: auto; animation: mainIn 0.8s ease forwards; }
  @keyframes mainIn {
    from { opacity: 0; transform: scale(1.02); }
    to { opacity: 1; transform: scale(1); }
  }

  .hearts { position: absolute; inset: 0; pointer-events: none; }
  .heart {
    position: absolute;
    bottom: -10%;
    font-size: 22px;
    opacity: 0;
    color: var(--rose);
    animation: floatUp linear infinite;
  }
  .heart.alt { color: var(--lavender); }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity: 0; }
    10% { opacity: 0.85; }
    50% { transform: translateY(-52vh) translateX(12px) rotate(15deg) scale(1); }
    90% { opacity: 0.6; }
    100% { transform: translateY(-105vh) translateX(-10px) rotate(-10deg) scale(0.9); opacity: 0; }
  }

  .flower-wrap {
    position: absolute;
    width: 90px;
    height: 90px;
    transform-origin: center bottom;
    opacity: 0;
  }
  .flower-wrap.show { animation: sway 5s ease-in-out infinite, bloomIn 1.1s ease-out forwards; }
  .fl-tl { top: -18px; left: -18px; }
  .fl-br { bottom: -18px; right: -18px; }
  .fl-tr { top: -22px; right: -26px; width: 70px; height: 70px; }
  .fl-bl { bottom: -20px; left: -22px; width: 70px; height: 70px; }

  @keyframes bloomIn {
    0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
    70% { opacity: 1; }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes sway {
    0%, 100% { rotate: -4deg; }
    50% { rotate: 4deg; }
  }
  .fl-br.show, .fl-bl.show { animation-name: swayFlip, bloomIn; }
  @keyframes swayFlip {
    0%, 100% { rotate: 176deg; }
    50% { rotate: 184deg; }
  }
  .fl-br, .fl-bl { transform: rotate(180deg); }

  .stem { stroke: var(--leaf); stroke-width: 3; fill: none; }

  .card {
    position: relative;
    z-index: 5;
    width: min(88vw, 380px);
    text-align: center;
    padding: 38px 26px 34px;
    background: rgba(255, 250, 246, 0.72);
    border-radius: 28px;
    backdrop-filter: blur(6px);
    box-shadow: 0 20px 60px rgba(156, 63, 94, 0.18);
    opacity: 0;
    transform: translateY(14px);
  }
  #main.show .card {
    animation: cardIn 1s ease-out 0.3s forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow-icon { font-size: 30px; display: block; margin-bottom: 6px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(26px, 7.2vw, 34px);
    line-height: 1.28;
    margin: 0 0 8px;
    color: var(--rose-deep);
  }

  .sub {
    font-size: 15.5px;
    color: var(--plum);
    opacity: 0.75;
    margin: 0 0 26px;
    line-height: 1.5;
  }

  .buttons {
    position: relative;
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    min-height: 56px;
  }

  button.yes, button.no {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 16px;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .yes {
    background: var(--rose);
    color: white;
    box-shadow: 0 10px 22px rgba(198, 87, 122, 0.4);
  }
  .yes:active { transform: scale(0.95); }

  .no {
    background: transparent;
    color: var(--plum);
    opacity: 0.55;
    position: relative;
  }

  .reveal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    background: linear-gradient(160deg, #FFE3EC 0%, #F6D9E6 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .reveal.on { opacity: 1; pointer-events: auto; }

  .reveal-card { text-align: center; padding: 20px 30px; }
  .big-heart { font-size: 60px; animation: pop 0.6s ease; }
  @keyframes pop {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .reveal h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: clamp(24px, 7vw, 32px);
    color: var(--rose-deep);
    margin: 14px 0 6px;
  }
  .reveal p { color: var(--plum); opacity: 0.8; font-size: 15px; }

  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti span {
    position: absolute;
    top: -10%;
    font-size: 18px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(120vh) rotate(360deg); opacity: 0.2; }
  }
</style>
</head>
<body>

<!-- ===================== INTRO SCREEN ===================== -->
<div class="screen" id="intro">
  <!-- extra flowers floating in the dark background -->
  <svg class="bg-flower bgf-1" id="bg1" viewBox="0 0 100 100">
    <g transform="translate(50,50)">
      <ellipse class="petal light" cx="0" cy="-16" rx="10" ry="16"/>

      <ellipse class="petal light" cx="0" cy="14" rx="9" ry="14"/>
      <ellipse class="petal light" cx="-14" cy="0" rx="14" ry="9"/>

      <circle class="center-dot" r="6"/>
    </g>
  </svg>

  <div class="bouquet-wrap">

    <!-- extra bouquet flowers -->
    <svg class="flower-slot fs-6" id="f6" viewBox="0 0 100 100">
      <g transform="translate(50,50)">
        <ellipse class="petal light" cx="0" cy="-13" rx="8" ry="13"/>

        <ellipse class="petal" cx="0" cy="13" rx="8" ry="13"/>
        <ellipse class="petal" cx="-13" cy="0" rx="13" ry="8"/>
        <ellipse class="petal" cx="13" cy="0" rx="13" ry="8"/>
        <circle class="center-dot" r="6"/>
      </g>
    </svg>

    <!-- flowers blooming one by one -->
    <svg class="flower-slot fs-2" id="f2" viewBox="0 0 100 100">
      <g transform="translate(50,50)">
        <ellipse class="petal alt" cx="0" cy="-16" rx="10" ry="16"/>
        <ellipse class="petal alt" cx="0" cy="16" rx="10" ry="16"/>
        <ellipse class="petal alt" cx="-16" cy="0" rx="16" ry="10"/>
        <ellipse class="petal alt" cx="16" cy="0" rx="16" ry="10"/>

      </g>
    </svg>

    <svg class="flower-slot fs-3" id="f3" viewBox="0 0 100 100">
      <g transform="translate(50,50)">
        <ellipse class="petal peach" cx="0" cy="-16" rx="10" ry="16"/>
        <ellipse class="petal peach" cx="0" cy="16" rx="10" ry="16"/>
        <ellipse class="petal peach" cx="-16" cy="0" rx="16" ry="10"/>

        <circle class="center-dot" r="8"/>
      </g>

      <g transform="translate(50,50)">

        <ellipse class="petal" cx="0" cy="18" rx="11" ry="18"/>

    <!-- panda holding the bouquet -->

<!-- ===================== MAIN SCREEN ===================== -->
<div class="screen" id="main">
  <div class="hearts" id="heartsField"></div>

  <svg class="flower-wrap fl-tl" viewBox="0 0 100 100">
    <path class="stem" d="M50 90 C 45 70, 55 55, 50 40"/>
    <g transform="translate(50,30)">
      <ellipse class="petal" cx="0" cy="-14" rx="9" ry="14"/>

      <ellipse class="petal alt" cx="0" cy="-14" rx="9" ry="14"/>
      <ellipse class="petal alt" cx="0" cy="14" rx="9" ry="14"/>
      <ellipse class="petal alt" cx="-14" cy="0" rx="14" ry="9"/>
      <ellipse class="petal alt" cx="14" cy="0" rx="14" ry="9"/>

      <button class="yes" id="yesBtn">Ναι, φυσικά! 🌸</button>

  <div class="confetti" id="confetti"></div>
  <div class="reveal-card">
    <div class="big-heart">💖</div>
    <h2>Ειι εκλεισε!</h2>
    <p>Πάποη ζουζουνιά και μπε</p>
  </div>
</div>

<script>
  // ---- intro sequence: flowers bloom one by one, then panda sends hearts, then button ----
  const order = ['f1','f2','f3','f4','f5','f6','f7'];
  const bgOrder = ['bg1','bg2','bg3','bg4','bg5','bg6'];
  window.addEventListener('load', () => {
    order.forEach((id, i) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('bloom');
      }, 250 + i * 280);
    });

    bgOrder.forEach((id, i) => {
      setTimeout(() => {
        document.getElementById(id).classList.add('bloom');
      }, 200 + i * 220);
    });

    const afterBloom = 250 + order.length * 280 + 400;

    setTimeout(() => {
      document.getElementById('kissBurst').classList.add('go');
      document.querySelectorAll('.mini-hearts-burst span').forEach(s => s.classList.add('go'));
    }, afterBloom);

    setTimeout(() => {
      document.getElementById('introCaption').classList.add('show');
      document.getElementById('nextBtn').classList.add('show');
    }, afterBloom + 900);
  });

  // ---- go to main screen ----
  document.getElementById('nextBtn').addEventListener('click', () => {
    document.getElementById('intro').classList.add('hide');
    const main = document.getElementById('main');
    main.classList.add('show');

    document.querySelectorAll('#main .flower-wrap').forEach((f, i) => {
      setTimeout(() => f.classList.add('show'), 200 + i * 150);
    });
  });

  // floating hearts on main screen
  const heartsField = document.getElementById('heartsField');
  const heartChars = ['💗','💕','🌸','💞'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'heart' + (i % 2 === 0 ? '' : ' alt');
    el.textContent = heartChars[i % heartChars.length];
    el.style.left = (Math.random() * 92) + '%';
    el.style.fontSize = (16 + Math.random() * 14) + 'px';
    const dur = 7 + Math.random() * 6;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * dur) + 's';
    heartsField.appendChild(el);
  }

  // playful "no" button dodges
  const noBtn = document.getElementById('noBtn');
  const buttonsRow = document.querySelector('#main .buttons');
  function dodge(e) {
    e.preventDefault();
    const rowRect = buttonsRow.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const maxY = 40;
    const randX = (Math.random() - 0.5) * 2 * (rowRect.width / 2);
    const randY = (Math.random() - 0.5) * 2 * maxY;
    noBtn.style.position = 'absolute';
    noBtn.style.left = Math.max(4, Math.min(rowRect.width - btnRect.width - 4, rowRect.width / 2 + randX - btnRect.width / 2)) + 'px';
    noBtn.style.top = (18 + randY) + 'px';
  }
  noBtn.addEventListener('mouseenter', dodge);
  noBtn.addEventListener('touchstart', dodge, { passive: false });
  noBtn.addEventListener('click', dodge);

  // yes reveal
  document.getElementById('yesBtn').addEventListener('click', () => {
    const reveal = document.getElementById('reveal');
    reveal.classList.add('on');
    const confetti = document.getElementById('confetti');
    const bits = ['💖','🌸','💕','🌷','✨'];
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.textContent = bits[Math.floor(Math.random() * bits.length)];
      s.style.left = (Math.random() * 100) + '%';
      s.style.fontSize = (14 + Math.random() * 16) + 'px';
      const dur = 2.5 + Math.random() * 2.5;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (Math.random() * 1.2) + 's';
      confetti.appendChild(s);
    }
  });
</script>

</body>
</html>
